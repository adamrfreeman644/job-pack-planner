<main>
<section class="capture" id="capture-panel" aria-label="Record work times"><div class="actions" id="actions"></div><div class="clock-time" id="clock-time"><button id="event-time" type="button" aria-label="Edit time to record" aria-haspopup="dialog"></button><button id="live-time" type="button" hidden>Use live time</button></div>
<dialog id="time-picker" aria-label="Edit time to record"><form method="dialog"><div class="wheel-head"><span>Hours</span><span>Minutes</span></div><div class="wheels"><select id="hours" aria-label="Hours" size="5"></select><select id="minutes" aria-label="Minutes" size="5"></select></div><div class="wheel-actions"><button value="cancel">Cancel</button><button value="set">Set time</button></div></form></dialog><small id="leave-wait" hidden>Leave job is available two minutes after arrival.</small><p id="status" role="status"></p><small id="photo-feedback" aria-live="polite"></small></section>
<section id="settings-panel" hidden><p><button id="set-home" type="button">Use current location as home</button></p><p id="home-setting" role="status"></p><p><button id="upload-qr-button" type="button">Photo upload QR</button></p><label class="weekends"><input id="weekends" type="checkbox"> Show weekends</label><p id="legacy-status">Loading legacy jobs…</p><strong>Job photos from Immich</strong><p class="muted" id="photo-status"></p><form id="immich-form">
        <label class="field">Immich address<input id="immich-url" type="url" placeholder="http://your-immich-server:2283" autocomplete="url"></label>
        <label class="field">API key<input id="immich-key" type="password" autocomplete="new-password" placeholder="Enter an Immich API key"></label>
        <p class="help" id="immich-key-help">The key stays on this server and is never displayed again.</p>
        <input type="hidden" id="immich-timezone" value="Europe/London">
        <input type="hidden" id="immich-margin" value="0">
        <input type="hidden" id="immich-interval" value="5">
        <button type="submit" class="wide" id="immich-save">Save photo settings</button>
        <button type="button" class="secondary wide" id="immich-test">Save and test connection</button>
        <button type="button" class="secondary wide" id="immich-disconnect">Remove saved API key</button>
      </form><p id="immich-status" role="status">Loading photo settings…</p></section>
<section id="calendar-panel" hidden><div class="month"><button id="prev" aria-label="Previous week">‹</button><strong id="month"></strong><button id="today">Today</button><button id="next" aria-label="Next week">›</button></div><div id="calendar"></div><div id="day"></div></section>
<nav class="bottom" aria-label="Planner views"><button id="capture-tab" aria-pressed="true">Clock</button><button id="calendar-tab" aria-pressed="false">Calendar</button><button id="settings-tab" aria-pressed="false">Settings</button></nav>
</main>
<dialog id="upload-qr" aria-label="Upload work photos"><h2>Upload work photos</h2><img src="/static/photo-upload-qr.svg" alt="QR code for https://workphotos.ad53app.com" width="300" height="300"><p><a href="https://workphotos.ad53app.com" target="_blank" rel="noopener">Open photo upload</a></p><form method="dialog"><button>Close</button></form></dialog>
<dialog id="arrival-choice" aria-label="Confirm arrival"><p id="arrival-reason"></p><form method="dialog"><button value="job">Job</button> <button value="home">Home</button> <button value="cancel">Cancel</button></form></dialog>
<dialog id="edit-day" aria-label="Edit day"><form id="edit-form"><h2>Edit day</h2><div id="edit-fields"></div><p id="edit-error" role="alert"></p><button type="submit">Save changes</button> <button type="button" id="cancel-edit">Cancel</button></form></dialog>
<script>
'use strict';
const $ = id => document.getElementById(id);
const key = 'work-planner-demo-v1';
$('upload-qr-button').onclick = () => $('upload-qr').showModal();
function dateKey(date) {
  return [date.getFullYear(), String(date.getMonth()+1).padStart(2,'0'), String(date.getDate()).padStart(2,'0')].join('-');
}
const time = stamp => new Date(stamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});
let days = {};
try { days = JSON.parse(localStorage.getItem(key) || '{}'); } catch {}
let selected = dateKey(new Date());
let month = new Date(selected+'T12:00:00');
const legacyDays = {};
const calendarDay = date => {
  const old = legacyDays[date];
  const current = days[date];
  if (old && current) return {...current, jobs:[...old.jobs,...current.jobs]};
  return current ?? old;
};
async function loadLegacy() {
  try {
    const response = await fetch('/api/legacy');
    if (!response.ok) throw new Error();
    const rows = await response.json();
    for (const row of rows) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(row.day)) continue;
      const day = legacyDays[row.day] ??= {date:row.day, jobs:[], legacy:true};
      day.jobs.push({name:[row.title,row.postcode,row.job_no].filter(Boolean).join(' · '),
        legacy:true, legacyId:row.id, legacyStart:row.start, legacyEnd:row.finish, photos:[]});
    }
    $('legacy-status').textContent = rows.length ? rows.length+' legacy jobs loaded.' : 'No legacy database loaded.';
    render();
  } catch {
    $('legacy-status').textContent = 'Could not load legacy jobs.';
  }
}
const connected = true;
function photoStatus(message) {
  $('photo-feedback').textContent = message;
}
async function checkPhotos(job) {
  const start = job.start.time, end = job.end.time;
  if (!connected) return;
  photoStatus('Checking Immich for this visit…');
  try {
    const response = await fetch('/api/clock/photos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start,end})});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    if (job.start.time !== start || job.end?.time !== end || !Object.values(days).some(day => day.jobs.includes(job))) return;
    job.photos = result.map(photo => ({name:time(photo.taken), data:photo.url}));
    localStorage.setItem(key, JSON.stringify(days));
    photoStatus(job.photos.length+' Immich photo(s) attached.');
    render();
  } catch (error) {
    photoStatus('Immich check failed: '+error.message);
  }
}
const active = () => Object.values(days).find(day => !day.home);
function save(message) {
  try { localStorage.setItem(key, JSON.stringify(days)); $('status').textContent = message; }
  catch { $('status').textContent = 'Browser storage is full or unavailable. This change is only saved for the current page session.'; }
}
function node(tag, value) {
  const element = document.createElement(tag);
  element.textContent = value;
  return element;
}
function button(label, handler) {
  const element = node('button', label);
  element.onclick = handler;
  return element;
}
const minimumVisit = 120000;
const homeKey = key+'-home-location';
let homeLocation;
try { homeLocation = JSON.parse(localStorage.getItem(homeKey)); } catch {}
let arrivalPending = false;
function readGps() {
  return new Promise((resolve,reject)=>{
    if (!navigator.geolocation) { reject(new Error('Location unavailable')); return; }
    navigator.geolocation.getCurrentPosition(({coords})=>{
      resolve({lat:coords.latitude,lon:coords.longitude,accuracy:coords.accuracy});
    },reject,{enableHighAccuracy:true,timeout:10000,maximumAge:0});
  });
}
function distanceFromHome(gps) {
  const radians = degrees => degrees*Math.PI/180;
  const lat = radians(gps.lat-homeLocation.lat);
  const lon = radians(gps.lon-homeLocation.lon);
  const a = Math.sin(lat/2)**2 + Math.cos(radians(gps.lat))*Math.cos(radians(homeLocation.lat))*Math.sin(lon/2)**2;
  return 12742000*Math.asin(Math.sqrt(Math.min(1,a)));
}
const homeSetting = $('home-setting');
homeSetting.textContent = homeLocation ? 'Home location saved.' : 'Set your home location while you’re at home.';
$('set-home').onclick = async event => {
  const control = event.currentTarget;
  control.disabled = true;
  try {
    const gps = await readGps();
    if (gps.accuracy > 500) throw new Error('Location is too imprecise to save.');
    localStorage.setItem(homeKey,JSON.stringify(gps));
    homeLocation = gps;
    homeSetting.textContent = 'Home location saved.';
  } catch (error) { homeSetting.textContent = error.message || 'Could not get or save your location.'; }
  finally { control.disabled = false; }
};
async function classifyArrival(event) {
  try { event.gps = await readGps(); } catch {}
  if (homeLocation && event.gps && event.gps.accuracy <= 500) {
    const distance = distanceFromHome(event.gps);
    const uncertainty = event.gps.accuracy + homeLocation.accuracy;
    if (distance + uncertainty <= 5000) return 'home';
    if (distance - uncertainty > 5000) return 'arrive';
  }
  const dialog = $('arrival-choice');
  $('arrival-reason').textContent = !homeLocation ? 'Home location is unset. Where did you arrive?' :
    'GPS couldn’t determine whether you’re near home. Where did you arrive?';
  dialog.returnValue = '';
  return new Promise(resolve=>{
    dialog.addEventListener('close',()=>resolve({home:'home',job:'arrive'}[dialog.returnValue]),{once:true});
    dialog.showModal();
  });
}
function editDay(day) {
  if (arrivalPending) return;
  const dialog = $('edit-day');
  const fields = $('edit-fields');
  const error = $('edit-error');
  const padPart = value => String(value).padStart(2,'0');
  function timeField(label, event) {
    const wrapper = node('label',label);
    const input = document.createElement('input');
    input.type = 'datetime-local';
    input.step = '1';
    if (event) {
      const date = new Date(event.time);
      input.value = dateKey(date)+'T'+[date.getHours(),date.getMinutes(),date.getSeconds()].map(padPart).join(':');
    }
    const original = input.value;
    wrapper.append(input);
    return {wrapper,input,read:()=>input.value === original ? event :
      input.value ? {...event,time:new Date(input.value).getTime()} : undefined};
  }
  const start = timeField('Left home',day.start);
  const home = timeField('Arrived home',day.home);
  start.input.required = true;
  const rows = day.jobs.map((job,index)=>{
    const row = document.createElement('fieldset');
    const arrived = timeField('Arrived at job',job.start);
    const left = timeField('Left job',job.end);
    const remove = document.createElement('input');
    remove.type = 'checkbox';
    const label = node('label','Remove this job');
    label.prepend(remove);
    remove.style.width = 'auto';
    remove.style.display = 'inline';
    row.append(node('legend',job.name ?? 'Job '+(index+1)),arrived.wrapper,left.wrapper,label);
    return {job,row,arrived,left,remove};
  });
  fields.replaceChildren(start.wrapper,...rows.map(entry=>entry.row),home.wrapper);
  error.textContent = '';
  $('cancel-edit').onclick = () => dialog.close();
  $('edit-form').onsubmit = event => {
    event.preventDefault();
    const departure = start.read(), arrival = home.read();
    const kept = rows.filter(entry=>!entry.remove.checked);
    const jobs = kept.map(({job,arrived,left})=>({...job,start:arrived.read(),end:left.read()}));
    let previous = departure?.time;
    for (const [index,job] of jobs.entries()) {
      if (!job.start || job.start.time < previous ||
          (job.end && job.end.time-job.start.time < minimumVisit) ||
          (!job.end && (arrival || index < jobs.length-1))) {
        error.textContent = 'Keep visits in order and allow at least two minutes per completed job.';
        return;
      }
      previous = job.end?.time ?? job.start.time;
    }
    if (!departure || dateKey(new Date(departure.time)) !== day.date || previous > Date.now() ||
        (arrival && (arrival.time < previous || arrival.time > Date.now())) ||
        (!arrival && active() && active() !== day)) {
      error.textContent = 'Check the day and time order. Only one day can be open at a time.';
      return;
    }
    const changed = [];
    jobs.forEach((job,index)=>{
      const old = kept[index].job;
      if (job.start === old.start && job.end === old.end) { jobs[index] = old; return; }
      job.photos = [];
      if (job.end) changed.push(job);
    });
    Object.assign(day,{start:departure,home:arrival,jobs});
    dialog.close();
    save('Day updated.');
    render();
    for (const job of changed) checkPhotos(job);
  };
  dialog.showModal();
}

function updateLeaveButton() {
  const leave = $('leave-job');
  if (!leave) return;
  const ready = Date.now() >= active().jobs.at(-1).start.time + minimumVisit;
  leave.disabled = !ready;
  $('leave-wait').hidden = ready;
}
let manualTime = false;
const timeInput = $('event-time');
const picker = $('time-picker');
const pad = value => String(value).padStart(2,'0');
for (const [id, count, step] of [['hours',24,1],['minutes',12,5]]) {
  for (let i=0;i<count;i++) {
    const value = pad(i*step);
    $(id).add(new Option(value,value));
  }
}
function syncLiveTime() {
  if (manualTime) return;
  const now = new Date();
  timeInput.value = pad(now.getHours())+':'+pad(now.getMinutes());
  timeInput.textContent = timeInput.value;
}
function resetLiveTime() {
  manualTime = false;
  $('live-time').hidden = true;
  syncLiveTime();
}
timeInput.onclick = () => {
  const [hours,minutes] = timeInput.value.split(':');
  $('hours').value = hours;
  $('minutes').value = pad(Math.floor(Number(minutes)/5)*5);
  picker.returnValue = '';
  picker.showModal();
};
picker.onclose = () => {
  if (picker.returnValue !== 'set') return;
  manualTime = true;
  timeInput.value = $('hours').value+':'+$('minutes').value;
  timeInput.textContent = timeInput.value;
  $('live-time').hidden = false;
};
$('live-time').onclick = resetLiveTime;
syncLiveTime();
setInterval(() => { syncLiveTime(); updateLeaveButton(); }, 1000);
async function stamp(day, type) {
  if (arrivalPending) return;

  const now = Date.now();
  const event = {time:manualTime ? new Date(dateKey(new Date(now))+'T'+timeInput.value).getTime() : now};
  const lastJob = day?.jobs.at(-1);
  const previous = lastJob?.end ?? lastJob?.start ?? day?.start;
  if (!Number.isFinite(event.time) || event.time > now || event.time < (previous?.time ?? 0)) {
    $('status').textContent = 'Choose a time between your last recorded action and now.';
    return;
  }
  if (type === 'leave' && event.time < lastJob.start.time + minimumVisit) {
    $('status').textContent = 'Leave time must be at least two minutes after arrival.';
    return;
  }
  if (type === 'arrive') {
    arrivalPending = true;
    render();
    try { type = await classifyArrival(event); }
    finally { arrivalPending = false; }
    if (!type) { render(); return; }
  }
  resetLiveTime();
  if (type==='start') {
    const date = dateKey(new Date(event.time));
    if (days[date]) return;
    day = days[date] = {date,start:event,jobs:[]};
  }
  if (type==='arrive') day.jobs.push({start:event,photos:[]});
  if (type==='leave') day.jobs.at(-1).end = event;
  if (type==='home') day.home = event;
  selected = day.date;
  month = new Date(selected+'T12:00:00');
  save('Saved at '+time(event.time)+'.');
  render();
  if (type !== 'leave') return;
  checkPhotos(day.jobs.at(-1));
  if (!navigator.geolocation) {
    $('status').textContent = 'Time saved. GPS is unavailable.';
    return;
  }
  navigator.geolocation.getCurrentPosition(({coords}) => {
    event.gps = {lat:coords.latitude,lon:coords.longitude,accuracy:coords.accuracy};
    save('GPS saved for '+time(event.time)+'.');
    render();
  }, () => { $('status').textContent = 'Time saved. GPS was unavailable or permission was denied.'; },
  {enableHighAccuracy:true,timeout:10000,maximumAge:0});
}
function duration(ms) {
  const minutes = Math.floor(ms/60000);
  if (!minutes && ms > 0) return '<1 min';
  const hours = Math.floor(minutes/60);
  return hours ? hours+' h'+(minutes%60 ? ' '+minutes%60+' min' : '') : minutes+' min';
}
function durationBadge(tag, label, icon, ms) {
  const badge = node(tag,'');
  const symbol = node('span',icon);
  symbol.className = 'duration-icon';
  symbol.setAttribute('aria-hidden','true');
  badge.title = label;
  badge.append(symbol,node('span',duration(ms)));
  return badge;
}
function visitTimes(job, date) {
  if (!job.legacy) return [job.start?.time,job.end?.time];
  const start = Date.parse(date+'T'+job.legacyStart);
  let end = Date.parse(date+'T'+job.legacyEnd);
  if (end < start) {
    const next = new Date(end);
    next.setDate(next.getDate()+1);
    end = next.getTime();
  }
  return [start,end];
}
function dayRundown(day) {
  const summary = node('dl','');
  summary.className = 'day-rundown';
  const total = day.home.time-day.start.time;
  const onsite = day.jobs.reduce((sum,job)=>sum+(job.end ? job.end.time-job.start.time : 0),0);
  for (const [label,value] of [
    ['Left home',time(day.start.time)],['Arrived home',time(day.home.time)],
    ['Jobs',String(day.jobs.length)],['On site',duration(onsite)],
    ['Travel & gaps',duration(total-onsite)],['Total day',duration(total)]
  ]) {
    const item = node('div','');
    item.append(node('dt',label),node('dd',value));
    summary.append(item);
  }
  return summary;
}
function render() {
  const today = dateKey(new Date());
  const current = active();
  const actions = $('actions');
  actions.replaceChildren();
  actions.dataset.phase = !current ? 'start' : current.jobs.at(-1) && !current.jobs.at(-1).end ? 'onsite' : 'travel';
  $('leave-wait').hidden = true;
  $('clock-time').hidden = !current && Boolean(days[today]);
  if (!current) {
    if (days[today]) {
      const done = node('div','');
      done.className = 'completed';
      done.append(node('strong','Today is complete'),dayRundown(days[today]),button('Edit day',()=>editDay(days[today])));
      actions.append(done);
    }
    else actions.append(button('Leave HOME', () => stamp(null,'start')));
  } else if (current.jobs.at(-1) && !current.jobs.at(-1).end) {
    const leave = button('Leave job', () => stamp(current,'leave'));
    leave.id = 'leave-job';
    leave.setAttribute('aria-describedby','leave-wait');
    actions.append(leave);
    updateLeaveButton();
  } else {
    const arrive = button(arrivalPending ? 'Checking location…' : 'Arrived', () => stamp(current,'arrive'));
    arrive.disabled = arrivalPending;
    actions.append(arrive);
  }
  const weekStart = new Date(month);
  weekStart.setDate(month.getDate() - (month.getDay()+6)%7);
  const grid = $('calendar');
  const weekends = $('weekends').checked;
  const labels = weekends ? ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'] : ['Mon','Tue','Wed','Thu','Fri'];
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate()+labels.length-1);
  const format = new Intl.DateTimeFormat(undefined,{day:'numeric',month:'short'});
  $('month').textContent = format.formatRange(weekStart,weekEnd);
  grid.style.setProperty('--days', labels.length);
  grid.replaceChildren(...labels.map(label=>node('small',label)));
  for(let i=0;i<labels.length;i++) {
    const day = new Date(weekStart);
    day.setDate(weekStart.getDate()+i);
    const date=dateKey(day);
    const entry=calendarDay(date);
    const cell=button(String(day.getDate()),()=>{selected=date;render();});
    const count = entry?.jobs.length ?? 0;
    if (count) {
      const dots = node('span','');
      dots.className = 'job-dots';
      dots.setAttribute('aria-hidden','true');
      for(let j=0;j<count;j++) dots.append(node('span',''));
      cell.append(dots);
    }
    if(entry) cell.classList.add(entry.sample?'sample':'logged');
    cell.setAttribute('aria-pressed',String(selected===date));
    cell.setAttribute('aria-label',date+(entry?.sample?', sample day':'')+', '+count+(count===1?' job':' jobs'));
    grid.append(cell);
  }
  const pane=$('day');
  const expanded=new Set([...pane.querySelectorAll('details[open]')].map(element=>element.dataset.id));
  const heading = node('div','');
  heading.className = 'day-heading';
  heading.append(node('h2',new Date(selected+'T12:00:00').toLocaleDateString([], {weekday:'long',day:'numeric',month:'long'})));
  if (days[selected]) heading.append(button('Edit day',()=>editDay(days[selected])));
  pane.replaceChildren(heading);
  const day=calendarDay(selected);
  if(!day) {pane.append(node('p','No work recorded.'));return;}
  if(day.sample) pane.append(node('small','Sample day · separate from your work log'));
  function dayTime(label, event, style) {
    const row = node('div','');
    row.className = 'day-time '+style;
    row.append(node('span',label),node('strong',event ? time(event.time) : 'In progress'));
    return row;
  }
  if (!day.legacy) pane.append(dayTime('Left home',day.start,'departure'));
  const visits = day.jobs.map((job,index)=>({job,index,times:visitTimes(job,day.date)}));
  visits.sort((a,b)=>(Number.isFinite(a.times[0]) ? a.times[0] : Infinity) -
    (Number.isFinite(b.times[0]) ? b.times[0] : Infinity));
  let previousEnd = day.start?.time;
  visits.forEach(({job,index:i,times:[start,end]})=>{
    if (start > previousEnd) {
      const gap = durationBadge('p','Travel and gaps','🚗',start-previousEnd);
      gap.className = 'travel-gap';
      pane.append(gap);
    }
    previousEnd = Number.isFinite(end) ? Math.max(previousEnd ?? -Infinity,end) : undefined;
    const tile=node('details','');
    tile.dataset.id=day.date+'/'+i;
    tile.open=expanded.has(tile.dataset.id);
    const summary = node('summary','');
    summary.className = 'job-summary';
    const title = node('span',job.name ?? 'Job '+(i+1));
    title.className = 'job-name';
    const times = node('strong',job.legacy
      ? (job.legacyStart || '—')+' – '+(job.legacyEnd || '—')
      : time(job.start.time)+' – '+(job.end ? time(job.end.time) : 'Onsite'));
    times.className = 'job-times';
    const count = node('span',String(job.photos.length));
    count.className = 'photo-count';
    count.setAttribute('aria-label', job.photos.length + (job.photos.length === 1 ? ' photo' : ' photos'));
    const footer = node('span','');
    footer.className = 'job-footer';
    const timing = node('span','');
    timing.append(times);
    if (Number.isFinite(start) && end >= start) {
      const elapsed = durationBadge('span','Time on site','🔧',end-start);
      elapsed.className = 'job-duration';
      timing.append(elapsed);
    }
    footer.append(timing,count);
    summary.append(title,footer);
    tile.append(summary);
    if (job.legacy) {
      const content = node('div','');
      tile.append(content);
      let loading = false;
      async function loadPhotos() {
        if (!tile.open || loading) return;
        if (job.photosLoaded) { displayPhotos(); return; }
        loading = true;
        content.replaceChildren(node('p','Checking Immich…'));
        try {
          const response = await fetch('/api/clock/legacy/'+job.legacyId+'/photos',
            {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
          const photos = await response.json();
          if (!response.ok) throw new Error(photos.error);
          job.photos = photos.map(photo=>({name:time(photo.taken),data:photo.url}));
          job.photosLoaded = true;
          count.textContent = String(job.photos.length);
          count.setAttribute('aria-label',job.photos.length+' photos');
          displayPhotos();
        } catch (error) {
          content.replaceChildren(node('p',error.message),button('Try again',loadPhotos));
        } finally { loading = false; }
      }
      function displayPhotos() {
        content.replaceChildren();
        if (!job.photos.length) content.append(node('p','No photos in this visit’s time window, including five minutes either side.'));
        for (const photo of job.photos) {
          const picture = node('img','');
          picture.src = photo.data;
          picture.alt = photo.name;
          picture.loading = 'lazy';
          content.append(picture);
        }
      }
      tile.addEventListener('toggle',loadPhotos);
      if (tile.open) loadPhotos();
      pane.append(tile);
      return;
    }
    for (const [label,event] of [['Arrival',job.start],['Departure',job.end]]) {
      if(event?.gps) tile.append(node('p',label+' GPS · '+event.gps.lat.toFixed(5)+', '+event.gps.lon.toFixed(5)+' (±'+Math.round(event.gps.accuracy)+' m)'));
    }
    if(!job.photos.length) tile.append(node('p','No photos attached.'));
    const gallery = node('div','');
    function showPhotos() {
      if (!tile.open || gallery.childElementCount) return;
    for(const photo of job.photos) {
      const figure=node('figure','');
      const picture=node('img','');
      picture.src=photo.data;picture.alt=photo.name;picture.loading='lazy';
      figure.append(picture,node('figcaption',photo.name));
      gallery.append(figure);
    }
    }
    tile.append(gallery);
    tile.addEventListener('toggle', showPhotos);
    showPhotos();
    pane.append(tile);
  });
  if (day.home?.time > previousEnd) {
    const gap = durationBadge('p','Travel and gaps','🚗',day.home.time-previousEnd);
    gap.className = 'travel-gap';
    pane.append(gap);
  }
  if (!day.legacy) pane.append(dayTime('Arrived home',day.home,'return'));
}
for (const tab of ['capture','calendar','settings']) {

};

$('photo-status').textContent = connected ? 'Photos include five minutes before arrival and after departure. New visits check at sign-out. Open a legacy job to load its photos.' : 'Launch Start Planner to connect to Immich.';
render();
if (connected) loadLegacy();
if (location.hash === "#settings") $("settings-tab").click();
