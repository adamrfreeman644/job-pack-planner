<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#102f3e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Job Packs">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <title>Job Pack Planner</title>
  <style>
    :root{--ink:#152b36;--navy:#102f3e;--teal:#087f6d;--teal-soft:#e1f3ef;--bg:#edf2f3;--card:#fff;--line:#d7e2e5;--muted:#657984;--blue:#276f98}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
    header{height:70px;background:var(--navy);color:#fff;padding:0 max(18px,5vw);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 3px 16px #102f3e25}
    .brand-home{display:flex;align-items:center;text-decoration:none}.wordmark{display:block;width:215px;height:42px}.app-mark{display:none;width:42px;height:42px}
    .date{margin-left:auto;min-width:185px;height:46px;background:#173d4e;color:#fff;border:1px solid #6f8995;border-radius:11px;padding:10px 13px;font:inherit;font-size:1rem;font-weight:750;color-scheme:dark;cursor:pointer}
    .icon-link{display:grid;place-items:center;width:40px;height:40px;color:#fff;text-decoration:none;border:1px solid #577482;border-radius:10px;font-size:20px}
    main{max-width:900px;margin:0 auto;padding:22px 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #1939460d;overflow:hidden}
    .card-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}h1,h2,p{margin:0}.card-head h1{font-size:1.15rem}.summary{padding:11px 18px;background:#f7fafb;color:var(--muted);border-bottom:1px solid var(--line)}
    button,.button{appearance:none;border:0;background:var(--teal);color:#fff;border-radius:9px;padding:10px 13px;font:inherit;font-weight:750;cursor:pointer;text-decoration:none}.save{margin-left:auto}.secondary{background:#355b6d}.timeline{padding:18px}
    .event{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;min-height:86px}.event:last-child{min-height:auto}
    .rail{display:flex;align-items:center;flex-direction:column}.dot{width:14px;height:14px;background:var(--teal);border-radius:50%;margin-top:17px;box-shadow:0 0 0 4px var(--teal-soft);flex:0 0 auto}.line{width:2px;flex:1;background:#b8d6d1}.event:last-child .line{display:none}.home .dot{background:var(--navy);box-shadow:0 0 0 4px #dce6ea}
    .event-card{border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:12px}.home .event-card{background:#f5f8f9}.event-title{display:flex;gap:8px;align-items:start}.event-title strong{font-size:1rem;flex:1}.tag{font-size:.72rem;background:var(--teal-soft);color:var(--teal);padding:3px 8px;border-radius:20px;font-weight:850;white-space:nowrap}.meta{font-size:.84rem;color:var(--muted);margin-top:4px}.postcode{color:var(--blue);font-weight:750;text-decoration:none}
    .times{display:flex;gap:9px;margin-top:11px}.times label{flex:1;background:#f3f7f8;padding:7px 9px;border-radius:8px;font-size:.73rem;color:var(--muted)}.times input{display:block;border:0;background:transparent;width:100%;font:inherit;font-weight:850;color:var(--ink)}
    .actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.description{display:none;background:#f5f8f9;border-radius:8px;padding:10px;margin-top:9px;color:#3f5661}.description.open{display:block}
    .empty{margin:0 0 12px 36px;border:1px dashed #b7c8ce;border-radius:12px;padding:17px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,100px);background:var(--ink);color:#fff;padding:11px 15px;border-radius:9px;transition:.2s;z-index:10}.toast.on{transform:translate(-50%,0)}
    @media(max-width:780px){header{padding:0 12px;gap:9px}.wordmark{display:none}.app-mark{display:block}main{padding:12px}.card{border-radius:13px}.event{grid-template-columns:24px minmax(0,1fr);gap:6px}.timeline{padding:13px 10px}.event-card{padding:11px}.actions,.times{flex-direction:column}.empty{margin-left:30px}.date{min-width:155px;max-width:175px;height:48px;font-size:1rem}}
  </style>
  <link rel="stylesheet" href="/static/photos.css">
</head>
<body>
  <header><a class="brand-home" href="/" aria-label="Job Pack Planner"><img class="wordmark" src="/static/logo.svg" alt="Job Pack Planner"><img class="app-mark" src="/static/icon.svg" alt=""></a><button class="photo-header" id="check-photos">Check photos</button><input class="date" type="date" id="day"><a class="icon-link" href="/settings" aria-label="Settings">⚙</a></header>
  <main>
    <section class="card">
      <div class="card-head"><h1>Day timeline</h1><button class="save" id="save">Save day</button></div>
      <div class="summary" id="summary">Loading bookings…</div>
      <div class="timeline" id="timeline"></div>
    </section>
  </main>
  <section id="photo-viewer" class="photo-viewer" role="dialog" aria-modal="true" aria-label="Job photos" hidden>
    <img id="photo-picture" alt="Job photo" hidden>
    <div id="photo-message" class="photo-message" role="status"></div>
    <button type="button" class="photo-hit previous" aria-label="Previous photo"></button>
    <button type="button" class="photo-hit next" aria-label="Next photo"></button>
  </section>
  <div class="toast" id="toast"></div>
  <script>
    let all=[],settings={};
    const day=document.querySelector('#day'),timeline=document.querySelector('#timeline'),summary=document.querySelector('#summary');
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const localDay=()=>{const d=new Date(),n=new Date(d.getTime()-d.getTimezoneOffset()*60000);return n.toISOString().slice(0,10)};day.value=localDay();
    function pop(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
    async function load(){const x=await fetch('/api/state').then(r=>r.json());all=x.jobs;settings=x.settings;render()}
    function homeEvent(kind,time){const id=kind==='Leave home'?'leave':'return';return `<div class="event home"><div class="rail"><i class="dot"></i><i class="line"></i></div><div class="event-card"><div class="event-title"><strong>${kind}</strong><span class="tag">HOME</span></div><div class="meta">${kind==='Leave home'?'Start of working day':'End of working day'}</div><div class="times"><label>Time<input id="${id}" type="time" value="${esc(time)}" aria-label="${kind} time"></label></div></div></div>`}
    function jobEvent(j){const d=JSON.parse(j.details||'{}'),description=d['Work Required']||'No job description supplied.';return `<div class="event"><div class="rail"><i class="dot"></i><i class="line"></i></div><div class="event-card"><div class="event-title"><strong>${esc(j.title)}</strong><span class="tag">${esc(j.job_no)}</span></div><div class="meta"><a class="postcode" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(j.postcode||d['Site Address']||'')}">${esc(j.postcode||'Open map')} ↗</a></div><div class="times"><label>Arrive<input type="time" value="${esc(j.start)}" data-id="${j.id}" data-key="start"></label><label>Leave<input type="time" value="${esc(j.finish)}" data-id="${j.id}" data-key="finish"></label></div><div class="actions"><button class="secondary" data-description="${j.id}">Description</button><button class="secondary" data-photos="${j.id}">Photos</button><button data-save="${j.id}" data-job="${esc(j.job_no)}">Save XML</button></div><div class="description" id="description-${j.id}">${esc(description)}</div></div></div>`}
    function render(){const jobs=all.filter(j=>j.day===day.value).sort((a,b)=>a.position-b.position);summary.textContent=`${jobs.length} job${jobs.length===1?'':'s'} · ${settings.leave_home||'07:00'} leave · ${settings.return_home||'18:00'} home`;timeline.innerHTML=homeEvent('Leave home',settings.leave_home||'07:00')+(jobs.length?jobs.map(jobEvent).join(''):'<div class="empty">No bookings for this date.</div>')+homeEvent('Return home',settings.return_home||'18:00');timeline.querySelectorAll('[data-key]').forEach(input=>input.onchange=()=>{const job=all.find(j=>j.id==input.dataset.id);job[input.dataset.key]=input.value;updateSummary()});timeline.querySelectorAll('[data-description]').forEach(button=>button.onclick=()=>document.querySelector(`#description-${button.dataset.description}`).classList.toggle('open'));timeline.querySelectorAll('[data-save]').forEach(button=>button.onclick=()=>saveXml(button.dataset.save,button.dataset.job))}
    function updateSummary(){const jobs=all.filter(j=>j.day===day.value);summary.textContent=`${jobs.length} job${jobs.length===1?'':'s'} · ${document.querySelector('#leave').value} leave · ${document.querySelector('#return').value} home`}
    async function preparedFile(id,name){const r=await fetch('/api/export/'+id);if(!r.ok){pop((await r.json()).error);return null}return new File([await r.blob()],name+'.xml',{type:'application/xml'})}
    function downloadFile(file){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch(error){try{const box=document.createElement('textarea');box.value=text;box.style.position='fixed';box.style.opacity='0';document.body.appendChild(box);box.focus();box.select();const copied=document.execCommand('copy');box.remove();return copied}catch(fallbackError){return false}}}
    async function saveXml(id,name){const file=await preparedFile(id,name);if(file){downloadFile(file);const copied=await copyText(name);pop(copied?'XML saved · '+name+' copied':'XML saved · job number: '+name)}}
    document.querySelector('#save').onclick=async()=>{const jobs=all.filter(j=>j.day===day.value);settings.leave_home=document.querySelector('#leave').value;settings.return_home=document.querySelector('#return').value;await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({day:day.value,jobs,settings:{leave_home:settings.leave_home,return_home:settings.return_home}})});pop('Day saved');render()};
    day.onchange=render;load();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));
  </script>
  <script src="/static/photos.js"></script>
</body>
</html>
