<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Pack Planner</title><style>
:root{--n:#102b3b;--t:#087f6d;--bg:#edf2f3;--line:#dbe5e8;--muted:#657985}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172731;font:16px system-ui}header{background:var(--n);color:#fff;padding:15px 5%;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}header b{font-size:1.1rem}.logo{background:var(--t);padding:9px;border-radius:9px}.date{margin-left:auto;background:#193b4d;color:white;border:1px solid #527080;border-radius:9px;padding:8px}main{max-width:1050px;margin:auto;padding:18px;display:grid;grid-template-columns:1.4fr .7fr;gap:16px}.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 25px #102b3b14}.head{display:flex;gap:8px;align-items:center;padding:15px;border-bottom:1px solid var(--line)}h2,h3{margin:0}.head button,.primary{border:0;background:var(--t);color:#fff;padding:10px 12px;border-radius:9px;font-weight:750}.head button{margin-left:auto}.summary{padding:12px 15px;background:#f8fbfb;color:var(--muted)}.timeline{padding:15px}.job{display:grid;grid-template-columns:55px 20px 1fr;gap:8px}.at{font-weight:750;font-size:.88rem;padding-top:13px}.rail{display:flex;align-items:center;flex-direction:column}.dot{width:14px;height:14px;background:var(--t);border-radius:50%;margin-top:15px;box-shadow:0 0 0 3px #d8f0eb}.line{width:2px;flex:1;background:#b9d4d0}.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:start}.row strong{flex:1}.tag{font-size:.72rem;background:#dff4ef;color:var(--t);padding:3px 7px;border-radius:20px;font-weight:800}.meta{font-size:.85rem;color:var(--muted);margin-top:4px}.pc{color:#2874a6;font-weight:750}.times{display:flex;gap:8px;margin-top:10px}.times label{flex:1;background:#f2f6f7;padding:7px;border-radius:8px;font-size:.75rem}.times input{border:0;background:transparent;width:100%;font-weight:800}.side{padding:15px;margin-bottom:14px}.drop{display:block;text-align:center;border:2px dashed #a9bec5;padding:16px;border-radius:11px;color:var(--muted)}.drop input{display:none}.setting{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.setting label{font-size:.78rem;color:var(--muted)}.setting input{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px}.share{width:100%;margin-top:10px}.warn{font-size:.8rem;background:#fff4da;padding:9px;border-radius:8px;margin-top:10px}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,100px);background:#172731;color:#fff;padding:10px 14px;border-radius:9px;transition:.2s}.toast.on{transform:translate(-50%,0)}@media(max-width:750px){main{display:block;padding:10px}.side{margin-top:12px}.times{display:grid}.date{font-size:.78rem}}
</style></head><body><header><span class="logo">JP</span><b>Job Pack Planner</b><input class="date" type="date" id="day"></header><main><section class="card"><div class="head"><h2>Day timeline</h2><button id="save">Save times</button></div><div class="summary" id="summary">Loading bookings…</div><div class="timeline" id="timeline"></div></section><aside><section class="card side"><h3>Import bookings</h3><label class="drop">Choose booking XML files<input id="files" type="file" accept=".xml" multiple></label></section><section class="card side"><h3>Day settings</h3><div class="setting"><label>Leave home<input type="time" id="leave"></label><label>Return home<input type="time" id="return"></label><label>Resources<input id="resources"></label><label>RAMS number<input id="rams"></label></div></section><section class="card side"><h3>Forms Mobile template</h3><label class="drop">Upload one completed Job Pack XML<input id="master" type="file" accept=".xml"></label><div class="warn" id="masterState">Required once. Photos and answers are erased before it is stored.</div></section></aside></main><div class="toast" id="toast"></div><script>
let all=[],settings={};const day=document.querySelector('#day'),leaveHome=document.querySelector('#leave'),returnHome=document.querySelector('#return'),summaryEl=document.querySelector('#summary'),timelineEl=document.querySelector('#timeline'),resourcesEl=document.querySelector('#resources'),ramsEl=document.querySelector('#rams'),masterStateEl=document.querySelector('#masterState');day.value=new Date().toISOString().slice(0,10);function pop(t){let x=document.querySelector('#toast');x.textContent=t;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),2000)}async function load(){let x=await fetch('/api/state').then(r=>r.json());all=x.jobs;settings=x.settings;leaveHome.value=settings.leave_home||'07:00';returnHome.value=settings.return_home||'18:00';resourcesEl.value=settings.resources||'Adam Freeman, Peter Bennett, RA25 TLZ';ramsEl.value=settings.rams||'010203';masterStateEl.textContent=x.master?'Template installed ✓':'Required once. Photos and answers are erased before it is stored.';render()}function render(){let jobs=all.filter(x=>x.day===day.value);summaryEl.textContent=`${jobs.length} job${jobs.length===1?'':'s'} · ${leaveHome.value} leave home · ${returnHome.value} return`;timelineEl.innerHTML=jobs.length?jobs.map((j,i)=>`<div class="job"><div class="at">${j.start}</div><div class="rail"><i class="dot"></i><i class="line"></i></div><div class="box"><div class="row"><strong>${j.title}</strong><span class="tag">${j.job_no}</span></div><div class="meta"><a class="pc" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(j.postcode)}">${j.postcode||'Open map'} ↗</a></div><div class="times"><label>Arrive<input type="time" value="${j.start}" data-id="${j.id}" data-k="start"></label><label>Leave<input type="time" value="${j.finish}" data-id="${j.id}" data-k="finish"></label></div><button class="primary share" data-share="${j.id}" data-job="${j.job_no}">Share prepared XML</button></div></div>`).join(''):'<div class="meta">No bookings for this date.</div>';timelineEl.querySelectorAll('input').forEach(x=>x.onchange=()=>{let j=all.find(y=>y.id==x.dataset.id);j[x.dataset.k]=x.value});timelineEl.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>share(b.dataset.share,b.dataset.job))}async function share(id,name){let r=await fetch('/api/export/'+id);if(!r.ok){pop((await r.json()).error);return}let blob=await r.blob(),f=new File([blob],name+'-prepared.xml',{type:'text/xml'});if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:name+' prepared job pack'});else{let a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}}document.querySelector('#files').onchange=async e=>{let f=new FormData();[...e.target.files].forEach(x=>f.append('files',x));let x=await fetch('/api/import',{method:'POST',body:f}).then(r=>r.json());pop(`${x.added.length} booking(s) imported`);await load()};document.querySelector('#master').onchange=async e=>{let f=new FormData();f.append('file',e.target.files[0]);let r=await fetch('/api/master',{method:'POST',body:f});if(r.ok){pop('Template installed');load()}else pop('Could not read template')};document.querySelector('#save').onclick=async()=>{let jobs=all.filter(x=>x.day===day.value);await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({day:day.value,jobs,settings:{leave_home:leaveHome.value,return_home:returnHome.value,resources:resourcesEl.value,rams:ramsEl.value}})});pop('Timeline saved');render()};day.onchange=render;load();
</script><script>const importHeading=[...document.querySelectorAll('h3')].find(x=>x.textContent==='Import bookings');if(importHeading){importHeading.textContent='Booking inbox';const schedule=document.createElement('div');schedule.innerHTML='<strong>Automatic check: 7:00 pm</strong><div class="meta" id="outlookState">Outlook not connected</div><button class="primary share" id="connectOutlook">Connect Outlook</button><button class="primary share" id="pullOutlook" style="display:none;background:#36596b">Check Outlook now</button>';importHeading.after(schedule);const drop=importHeading.parentElement.querySelector('.drop');drop.style.marginTop='12px';drop.childNodes[0].textContent='Manually import booking XML';const state=document.querySelector('#outlookState'),connect=document.querySelector('#connectOutlook'),pull=document.querySelector('#pullOutlook');async function check(){let x=await fetch('/api/outlook/status').then(r=>r.json());state.textContent=x.message||'Outlook not connected';connect.style.display=x.connected?'none':'block';pull.style.display=x.connected?'block':'none';if(x.state==='admin_required'){alert('Microsoft requires administrator approval. The connection has stopped and no mailbox messages were downloaded.');return}if(x.state==='waiting')setTimeout(check,1500)}connect.onclick=async()=>{let r=await fetch('/api/outlook/start',{method:'POST'}),x=await r.json();if(!r.ok){alert(x.message);return}window.open(x.verification_uri,'_blank');alert('Enter this Microsoft code: '+x.user_code+'\n\nComplete your normal work login and Authenticator approval.');check()};pull.onclick=async()=>{state.textContent='Checking Outlook…';let r=await fetch('/api/outlook/pull',{method:'POST'}),x=await r.json();if(r.ok){pop(`${x.added.length} booking attachment(s) checked`);load()}else alert(x.error);check()};check()}</script></body></html>
